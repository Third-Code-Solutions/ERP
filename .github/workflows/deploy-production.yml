name: Production promotion

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Release reason and change reference
        required: true
        type: string
      verify_password_rotation:
        description: Verify and restore the demo account password during this release
        required: true
        type: boolean
        default: true

concurrency:
  group: abi-ops-production-promotion
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  promote:
    name: Promote ABI OPS production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      RAILWAY_CAD_SERVICE_ID: ${{ vars.RAILWAY_CAD_SERVICE_ID }}
      # The CLI's --scope parameter requires the team ID, not the dashboard
      # slug. The linked project records this value as orgId.
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      ERP_CORE_API_URL: ${{ vars.ERP_CORE_API_URL }}
      CAD_WORKER_URL: ${{ vars.CAD_WORKER_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      SUPABASE_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
      BUILD_OPS_DEMO_TENANT_SLUGS: ${{ vars.BUILD_OPS_DEMO_TENANT_SLUGS }}
      E2E_DEMO_TENANT_SLUG: ${{ vars.E2E_DEMO_TENANT_SLUG }}
      # The stable preview uses a different database/project fixture.
      E2E_PROJECT_ID: ${{ vars.PRODUCTION_E2E_PROJECT_ID }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    steps:
      - name: Check production branch
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Verify hosted CI for exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/verify-production-ci.mjs

      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in RUNTIME_DATABASE_URL VERCEL_TOKEN RAILWAY_API_TOKEN SUPABASE_MIGRATION_DATABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY PRODUCTION_DATABASE_URL E2E_PROJECT_ID E2E_USER_EMAIL E2E_USER_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required for production promotion" >&2
              exit 1
            fi
          done

      - name: Verify explicit installation targets
        run: node scripts/verify-installation-targets.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Block contaminated production promotion
        run: node scripts/verify-production-data-boundary.mjs --require-clear

      - name: Verify pinned workflow action refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm test:workflow-action-refs
          pnpm verify:workflow-action-refs

      - name: Run release gates
        run: |
          pnpm verify:abi-ops-brand
          pnpm verify:type-safety
          pnpm verify:app-router-boundaries
          pnpm verify:build-ops-invariants
          pnpm test:production-auth-proof
          pnpm test:production-ci
          node --test scripts/deploy-railway-service.test.mjs
          pnpm ci:actionlint
          pnpm lint
          pnpm turbo typecheck
          pnpm test:database-repro-policy-contract
          pnpm test
          pnpm build

      - name: Verify exact Supabase database targets
        run: node scripts/verify-installation-targets.mjs

      - name: Require current production migration ledger
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: node scripts/plan-database-release.mjs --require-current

      - name: Preview Supabase migration push
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_MIGRATION_DATABASE_URL" --dry-run --yes

      # This promotion is deliberately code-only while PITR is unavailable.
      # Any pending migration fails the ledger gate above and must use the
      # separately reviewed database release runbook with recovery evidence.

      - name: Deploy Nest API to exact Railway service
        run: node scripts/deploy-railway-service.mjs api

      - name: Deploy CAD evidence worker to exact Railway service
        run: node scripts/deploy-railway-service.mjs cad

      - name: Deploy web to exact Vercel production project
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx vercel@54.7.1 link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync(".vercel/project.json","utf8")); if(p.projectId!==process.env.VERCEL_PROJECT_ID || p.orgId!==process.env.VERCEL_SCOPE) throw new Error("Linked Vercel project differs from explicit installation target")'
          # Keep Vercel's runtime credential aligned with the protected release
          # secret. Vercel snapshots variables per deployment, so this must run
          # before creating the production deployment.
          pnpm dlx vercel@54.7.1 env add DATABASE_URL production --force --value "$RUNTIME_DATABASE_URL" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          pnpm dlx vercel@54.7.1 env add APP_REVISION production --force --value "$GITHUB_SHA" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          pnpm dlx vercel@54.7.1 deploy . --prod --force --with-cache --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify production health and release identity
        shell: bash
        run: |
          set -euo pipefail
          web_health="$(curl --fail --silent --show-error "$PRODUCTION_URL/api/health?deep=1")"
          web_ready="$(curl --fail --silent --show-error "$PRODUCTION_URL/api/ready")"
          test "$(jq -r '.revision' <<<"$web_health")" = "${GITHUB_SHA:0:12}"
          test "$(jq -r '.revision' <<<"$web_ready")" = "${GITHUB_SHA:0:12}"
          curl --fail --silent --show-error "$ERP_CORE_API_URL/health"
          curl --fail --silent --show-error "$ERP_CORE_API_URL/ready"
          curl --fail --silent --show-error "$CAD_WORKER_URL/health"
          node scripts/verify-production-surface.mjs --url "$PRODUCTION_URL"

      - name: Install Playwright Chromium
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          # Keep production verification deterministic when the hosted
          # runner's unrelated Google Chrome apt index is stale.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          pnpm exec playwright install --with-deps chromium

      - name: Verify production demo role and project boundary
        working-directory: apps/web
        env:
          E2E_PRODUCTION_DEMO_BOUNDARY: "1"
        shell: bash
        run: |
          set -euo pipefail
          report_path="$GITHUB_WORKSPACE/tmp/production-e2e/demo-boundary.json"
          mkdir -p "$(dirname "$report_path")"
          pnpm exec playwright test e2e/production-demo-boundary.spec.ts \
            --project=chromium --workers=1 --retries=0 --reporter=json > "$report_path"
          node "$GITHUB_WORKSPACE/scripts/assert-playwright-no-skips.mjs" \
            "$report_path" "production demo boundary"

      - name: Verify production cross-tenant project isolation
        working-directory: apps/web
        env:
          E2E_CROSS_TENANT_PROOF: "1"
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail
          report_path="$GITHUB_WORKSPACE/tmp/production-e2e/cross-tenant-isolation.json"
          mkdir -p "$(dirname "$report_path")"
          pnpm exec playwright test e2e/production-cross-tenant-isolation.spec.ts \
            --project=chromium --workers=1 --retries=0 --reporter=json > "$report_path"
          node "$GITHUB_WORKSPACE/scripts/assert-playwright-no-skips.mjs" \
            "$report_path" "production cross-tenant project isolation"

      - name: Run authenticated production E2E
        working-directory: apps/web
        env:
          E2E_MAGIC_LINK_AUTH: "1"
          E2E_ROLE_MATRIX_AUTH: "1"
          E2E_SCHEDULE_AUTH: "1"
          E2E_REAL_PASSWORD_RECOVERY: "1"
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail
          report_path="$GITHUB_WORKSPACE/tmp/production-e2e/playwright.json"
          mkdir -p "$(dirname "$report_path")"
          pnpm exec playwright test \
            e2e/auth.spec.ts \
            e2e/branding-authenticated.spec.ts \
            e2e/smoke-console.spec.ts \
            e2e/role-access-production.spec.ts \
            e2e/complete-route-audit.spec.ts \
            e2e/project-schedule-role-matrix.spec.ts \
            e2e/cad-worker-production.spec.ts \
            --project=chromium --workers=1 --reporter=json > "$report_path"
          node "$GITHUB_WORKSPACE/scripts/assert-playwright-no-skips.mjs" \
            "$report_path" "authenticated production E2E"

      # Magic-link authentication and password recovery share Supabase's
      # per-user email cooldown. Run the one-shot recovery proof only after the
      # role matrix has provided enough separation from the admin magic link.
      - name: Verify production password recovery request
        working-directory: apps/web
        env:
          E2E_REAL_PASSWORD_RECOVERY: "1"
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: >-
          pnpm exec playwright test e2e/production-password-recovery.spec.ts
          --project=chromium --workers=1 --retries=0 --reporter=line

      - name: Verify live profile password rotation and restoration
        if: ${{ inputs.verify_password_rotation }}
        working-directory: apps/web
        env:
          E2E_LIVE_PASSWORD_ROTATION: "1"
          E2E_LIVE_PASSWORD_ROTATION_CONFIRM_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: node e2e/live-password-rotation-harness.mjs

      - name: Record excluded password rotation verification
        if: ${{ always() && !inputs.verify_password_rotation }}
        shell: bash
        run: |
          {
            echo "### Verification scope"
            echo
            echo "Live demo-account password rotation and restoration were explicitly excluded from this release."
            echo "Password recovery and all non-password production gates remained mandatory."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: production-playwright-report
          path: tmp/production-e2e/
          retention-days: 14
