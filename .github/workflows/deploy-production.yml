name: Production promotion

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Release reason and change reference
        required: true
        type: string

concurrency:
  group: abi-ops-production-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Promote ABI OPS production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://thirdcode-erp.vercel.app
    env:
      SUPABASE_PROJECT_REF: aqqrtkmtcsfkbyyqxowv
      RAILWAY_PROJECT_ID: a21fd382-80b2-4218-8025-11f420a062e3
      RAILWAY_API_SERVICE_ID: c45b3d01-036a-4663-a524-0713d782fce3
      RAILWAY_CAD_SERVICE_ID: 328c6650-306e-4a3c-80dc-7566e80ba86a
      # The CLI's --scope parameter requires the team ID, not the dashboard
      # slug. The linked project records this value as orgId.
      VERCEL_SCOPE: team_n60dl3ccO8BFGFeUKQdqPhp3
      VERCEL_PROJECT_NAME: thirdcode-erp
      NEXT_PUBLIC_SUPABASE_URL: https://aqqrtkmtcsfkbyyqxowv.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      SUPABASE_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      BUILD_OPS_DEMO_TENANT_SLUGS: buildops-e2e
      E2E_PROJECT_ID: ${{ vars.E2E_PROJECT_ID }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    steps:
      - name: Check production branch
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN RAILWAY_API_TOKEN SUPABASE_MIGRATION_DATABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY PRODUCTION_DATABASE_URL E2E_PROJECT_ID E2E_USER_EMAIL E2E_USER_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required for production promotion" >&2
              exit 1
            fi
          done

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Block contaminated production promotion
        run: node scripts/verify-production-data-boundary.mjs --require-clear

      - name: Run release gates
        run: |
          pnpm verify:abi-ops-brand
          pnpm verify:type-safety
          pnpm verify:app-router-boundaries
          pnpm verify:build-ops-invariants
          pnpm test:production-auth-proof
          node --test scripts/deploy-railway-service.test.mjs
          pnpm ci:actionlint
          pnpm verify:workflow-action-refs
          pnpm lint
          pnpm turbo typecheck
          pnpm test:database-repro-policy-contract
          pnpm test
          pnpm build

      - name: Verify exact Supabase database targets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          project_ref = os.environ["SUPABASE_PROJECT_REF"]
          expected_user = f"postgres.{os.environ['SUPABASE_PROJECT_REF']}"

          def verify(name, allowed_ports):
              target = urlsplit(os.environ[name])
              hostname = (target.hostname or "").lower()
              database = target.path.removeprefix("/")
              if target.scheme not in {"postgres", "postgresql"}:
                  raise SystemExit(f"{name} must use PostgreSQL")
              if not hostname.endswith(".pooler.supabase.com"):
                  raise SystemExit(f"{name} must target a Supabase pooler")
              if target.username != expected_user:
                  raise SystemExit(f"{name} must target the exact Supabase project")
              if target.port not in allowed_ports or database != "postgres":
                  raise SystemExit(f"{name} has an unexpected port or database")

          verify("SUPABASE_MIGRATION_DATABASE_URL", {5432})
          verify("PRODUCTION_DATABASE_URL", {5432, 6543})
          PY

      - name: Require current production migration ledger
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: node scripts/plan-database-release.mjs --require-current

      - name: Preview Supabase migration push
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_MIGRATION_DATABASE_URL" --dry-run --yes

      # This promotion is deliberately code-only while PITR is unavailable.
      # Any pending migration fails the ledger gate above and must use the
      # separately reviewed database release runbook with recovery evidence.

      - name: Deploy Nest API to exact Railway service
        run: node scripts/deploy-railway-service.mjs api

      - name: Deploy CAD evidence worker to exact Railway service
        run: node scripts/deploy-railway-service.mjs cad

      - name: Deploy web to exact Vercel production project
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx vercel@54.7.1 link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          # Keep Vercel's runtime credential aligned with the protected release
          # secret. Vercel snapshots variables per deployment, so this must run
          # before creating the production deployment.
          pnpm dlx vercel@54.7.1 env add DATABASE_URL production --force --value "$PRODUCTION_DATABASE_URL" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          pnpm dlx vercel@54.7.1 env add APP_REVISION production --force --value "$GITHUB_SHA" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          pnpm dlx vercel@54.7.1 deploy . --prod --force --with-cache --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify production health and release identity
        shell: bash
        run: |
          set -euo pipefail
          web_health="$(curl --fail --silent --show-error https://thirdcode-erp.vercel.app/api/health)"
          web_ready="$(curl --fail --silent --show-error https://thirdcode-erp.vercel.app/api/ready)"
          test "$(jq -r '.revision' <<<"$web_health")" = "${GITHUB_SHA:0:12}"
          test "$(jq -r '.revision' <<<"$web_ready")" = "${GITHUB_SHA:0:12}"
          curl --fail --silent --show-error https://third-code-erp-api-production.up.railway.app/health
          curl --fail --silent --show-error https://third-code-erp-api-production.up.railway.app/ready
          curl --fail --silent --show-error https://abi-ops-cad-worker-production.up.railway.app/health
          node scripts/verify-production-surface.mjs --url https://thirdcode-erp.vercel.app

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated production E2E
        working-directory: apps/web
        env:
          E2E_MAGIC_LINK_AUTH: "1"
          E2E_ROLE_MATRIX_AUTH: "1"
          E2E_REAL_PASSWORD_RECOVERY: "1"
          PLAYWRIGHT_BASE_URL: https://thirdcode-erp.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          report_path="$GITHUB_WORKSPACE/tmp/production-e2e/playwright.json"
          mkdir -p "$(dirname "$report_path")"
          pnpm exec playwright test \
            e2e/auth.spec.ts \
            e2e/branding-authenticated.spec.ts \
            e2e/smoke-console.spec.ts \
            e2e/role-access-production.spec.ts \
            e2e/cad-worker-production.spec.ts \
            --project=chromium --workers=1 --reporter=json > "$report_path"
          node "$GITHUB_WORKSPACE/scripts/assert-playwright-no-skips.mjs" \
            "$report_path" "authenticated production E2E"

      # Magic-link authentication and password recovery share Supabase's
      # per-user email cooldown. Run the one-shot recovery proof only after the
      # role matrix has provided enough separation from the admin magic link.
      - name: Verify production password recovery request
        working-directory: apps/web
        env:
          E2E_REAL_PASSWORD_RECOVERY: "1"
          PLAYWRIGHT_BASE_URL: https://thirdcode-erp.vercel.app
        run: >-
          pnpm exec playwright test e2e/production-password-recovery.spec.ts
          --project=chromium --workers=1 --retries=0 --reporter=line

      - name: Verify live profile password rotation and restoration
        working-directory: apps/web
        env:
          E2E_LIVE_PASSWORD_ROTATION: "1"
          E2E_LIVE_PASSWORD_ROTATION_CONFIRM_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          PLAYWRIGHT_BASE_URL: https://thirdcode-erp.vercel.app
        run: node e2e/live-password-rotation-harness.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: production-playwright-report
          path: tmp/production-e2e/
          retention-days: 14
