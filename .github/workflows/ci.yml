name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# All third-party actions are pinned to a commit SHA (with the human-readable
# version trailing as a comment) per OWASP/SLSA hardening guidance and to make
# offline editor lint extensions resolve cleanly.
jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run actionlint
        run: node scripts/run-actionlint.mjs

  build-ops-invariants:
    name: BUILD OPS Invariants
    runs-on: ubuntu-latest
    needs: [actionlint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test invariant scanner
        run: pnpm test:build-ops-invariants
      - name: Collect changed migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/build-ops
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR \
              "origin/${GITHUB_BASE_REF}...${GITHUB_SHA}" -- \
              'supabase/migrations/*.sql' > tmp/build-ops/changed-migrations.txt
          elif [ -z "${GITHUB_EVENT_BEFORE:-}" ] || [ "${GITHUB_EVENT_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            git ls-files 'supabase/migrations/*.sql' > tmp/build-ops/changed-migrations.txt
          else
            git diff --name-only --diff-filter=ACMR \
              "${GITHUB_EVENT_BEFORE}" "${GITHUB_SHA}" -- \
              'supabase/migrations/*.sql' > tmp/build-ops/changed-migrations.txt
          fi
          cat tmp/build-ops/changed-migrations.txt
      - name: Verify changed migration invariants
        run: node scripts/verify-build-ops-invariants.mjs --files-list tmp/build-ops/changed-migrations.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: build-ops-invariants
          path: tmp/build-ops/
          retention-days: 7

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [actionlint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [actionlint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [actionlint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:turbo-test-cache
      - run: pnpm test:vitest-no-skips
      - run: pnpm test:playwright-no-skips
      - run: pnpm test:empty-schema-diff
      - run: pnpm test:production-data-boundary
      - name: Test dated Supabase parity manifest
        run: pnpm test:managed-supabase-parity-plan
      - name: Verify dated Supabase parity manifest against source
        run: pnpm verify:managed-supabase-parity-plan
      - run: pnpm test:process-sla-sql
      - run: pnpm test:wo-04-migration
      - run: pnpm test:wo-05-migration
      - run: pnpm test:wo-06-migration
      - run: pnpm test:wo-07-contract
      - run: pnpm test:wo-08-contract
      - run: pnpm test:wo-08a-contract
      - run: pnpm test:wo-10-contract
      - run: pnpm test:wo-11-contract
      - run: pnpm test:wo-12-contract
      - run: pnpm test:wo-13-contract
      - run: pnpm test:wo-14-contract
      - run: pnpm test:wo-15-contract
      - run: pnpm test:wo-16-contract
      - run: pnpm test:wo-17-contract
      - run: pnpm test:wo-18-contract
      - name: Run Web unit suite without skips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/test-reports
          pnpm --filter @third-code-erp/web exec vitest run \
            --exclude 'src/**/*.integration.test.ts' \
            --reporter=json \
            --outputFile="$GITHUB_WORKSPACE/tmp/test-reports/web-vitest.json"
          node scripts/assert-vitest-no-skips.mjs \
            tmp/test-reports/web-vitest.json "Web unit tests"
      - name: Run API unit suite without skips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/test-reports
          pnpm --filter @third-code-erp/api exec vitest run src test \
            --reporter=json \
            --outputFile="$GITHUB_WORKSPACE/tmp/test-reports/api-vitest.json"
          node scripts/assert-vitest-no-skips.mjs \
            tmp/test-reports/api-vitest.json "API unit tests"
      - name: Run shared authorization suite without skips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/test-reports
          pnpm --filter @third-code-erp/shared-types exec vitest run \
            --reporter=json \
            --outputFile="$GITHUB_WORKSPACE/tmp/test-reports/shared-types-vitest.json"
          node scripts/assert-vitest-no-skips.mjs \
            tmp/test-reports/shared-types-vitest.json "shared-types tests"
      - name: Enforce Web release coverage without skips
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @third-code-erp/web exec vitest run \
            --config vitest.release.config.ts \
            --reporter=json \
            --outputFile="$GITHUB_WORKSPACE/tmp/test-reports/web-release-coverage-vitest.json"
          node scripts/assert-vitest-no-skips.mjs \
            tmp/test-reports/web-release-coverage-vitest.json "Web release coverage"
      - name: Enforce API release coverage without skips
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @third-code-erp/api exec vitest run \
            --config vitest.release.config.ts \
            --reporter=json \
            --outputFile="$GITHUB_WORKSPACE/tmp/test-reports/api-release-coverage-vitest.json"
          node scripts/assert-vitest-no-skips.mjs \
            tmp/test-reports/api-release-coverage-vitest.json "API release coverage"
      - name: Enforce shared authorization coverage without skips
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @third-code-erp/shared-types exec vitest run \
            --config vitest.release.config.ts \
            --reporter=json \
            --outputFile="$GITHUB_WORKSPACE/tmp/test-reports/shared-types-release-coverage-vitest.json"
          node scripts/assert-vitest-no-skips.mjs \
            tmp/test-reports/shared-types-release-coverage-vitest.json "shared-types release coverage"
      - run: pnpm test:database-release-plan
      - run: pnpm test:project-cutover-plan
      - run: pnpm test:controlled-release-plan
      - run: pnpm test:release-identity-plan
      - run: pnpm test:web-db-boundary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: unit-test-reports
          path: |
            tmp/test-reports/
            apps/web/tmp/release-coverage/
            apps/api/tmp/release-coverage/
            packages/shared-types/tmp/release-coverage/

  database-reproducibility:
    name: Database Reproducibility (Postgres 17)
    runs-on: ubuntu-latest
    needs: [actionlint, build-ops-invariants]
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4.9-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Supabase local database only. No project reference, access token, or
      # production secret is present in this job.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_HARDENING_EXPECTED: "1"
      DATABASE_ACCOUNTING_EXPECTED: "1"
      DATABASE_RECEIVABLES_EXPECTED: "1"
      DATABASE_PAYABLES_EXPECTED: "1"
      DATABASE_CASH_EXPECTED: "1"
      DATABASE_RECONCILIATION_EXPECTED: "1"
      DATABASE_INVENTORY_EXPECTED: "1"
      DATABASE_BUDGET_EXPECTED: "1"
      DATABASE_STOCK_MOVEMENT_EXPECTED: "1"
      BUILD_OPS_DEMO_TENANT_SLUGS: abi-ops-local
      ERP_API_INTEGRATION_EXPECTED: "1"
      ERP_REDIS_RESTART_EXPECTED: "1"
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned database runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.109.1"
          grep -Eq '^major_version = 17$' supabase/config.toml
          docker version
          mkdir -p tmp/database-reproducibility
      - name: Rebuild database from zero
        run: |
          supabase db start
          supabase db reset --local
      - name: Verify BUILD OPS data invariant
        run: pnpm verify:build-ops-data
      - name: Verify RLS policy catalog classifier
        run: pnpm test:database-repro-policy-contract
      - name: Verify migration ledger and catalog
        run: node scripts/verify-database-repro.mjs
      - name: Verify release planner sees a current linear ledger
        run: node scripts/plan-database-release.mjs --require-current
      - name: Verify read-only audit recovery planner contract
        run: pnpm test:audit-recovery-plan
      - name: Verify audit hash profile contract
        run: pnpm test:audit-hash-profiles
      - name: Verify Purchase Order duplicate planner contract
        run: pnpm test:purchase-order-duplicate-plan
      - name: Capture local migration ledger
        shell: bash
        run: |
          set -o pipefail
          supabase migration list --local 2>&1 \
            | tee tmp/database-reproducibility/migration-list.txt
      - name: Capture and assert empty schema diff
        run: |
          set -euo pipefail
          supabase db diff --local --schema public --output-format json \
            > tmp/database-reproducibility/schema-diff.json
          node scripts/assert-empty-schema-diff.mjs \
            tmp/database-reproducibility/schema-diff.json
      # This script deliberately grants legacy Data API privileges only for
      # local tests. Apply it after the schema-diff gate so CI-only grants
      # cannot masquerade as a migration drift failure.
      - name: Apply CI-only legacy Data API grants
        run: |
          psql "$DATABASE_URL" \
            --file scripts/ci/supabase-default-privileges.sql \
            --set ON_ERROR_STOP=1
      - name: Assert CI-only client role grants
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" \
            --set ON_ERROR_STOP=1 \
            --command "select has_table_privilege('authenticated', 'public.users', 'SELECT') as authenticated_can_read, has_table_privilege('authenticated', 'public.users', 'INSERT') as authenticated_can_insert, has_table_privilege('anon', 'public.users', 'SELECT') as anon_can_read;" \
            --command "select has_table_privilege('authenticated', 'public.users', 'SELECT') and not has_table_privilege('authenticated', 'public.users', 'INSERT') and not has_table_privilege('authenticated', 'public.users', 'UPDATE') and not has_table_privilege('authenticated', 'public.users', 'DELETE') and not has_table_privilege('anon', 'public.users', 'SELECT') as grants_ok;"
          grants_ok=$(psql "$DATABASE_URL" --tuples-only --no-align --set ON_ERROR_STOP=1 --command "select has_table_privilege('authenticated', 'public.users', 'SELECT') and not has_table_privilege('authenticated', 'public.users', 'INSERT') and not has_table_privilege('authenticated', 'public.users', 'UPDATE') and not has_table_privilege('authenticated', 'public.users', 'DELETE') and not has_table_privilege('anon', 'public.users', 'SELECT');")
          test "$grants_ok" = "t"
      - name: Run database tests without skips
        run: >-
          pnpm --filter @third-code-erp/database exec vitest run
          --reporter=json
          --outputFile="$GITHUB_WORKSPACE/tmp/database-reproducibility/vitest.json"
      - name: Assert every database test executed
        run: >-
          node scripts/assert-vitest-no-skips.mjs
          tmp/database-reproducibility/vitest.json
          "database tests"
      - name: Enforce database release coverage without skips
        run: >-
          pnpm --filter @third-code-erp/database exec vitest run
          --config vitest.release.config.ts
          --reporter=json
          --outputFile="$GITHUB_WORKSPACE/tmp/database-reproducibility/release-coverage-vitest.json"
      - name: Assert every database release coverage test executed
        run: >-
          node scripts/assert-vitest-no-skips.mjs
          tmp/database-reproducibility/release-coverage-vitest.json
          "database release coverage"
      - name: Run Nest transaction boundary integration
        env:
          ERP_REDIS_RESTART_CONTAINER: ${{ job.services.redis.id }}
        run: >-
          pnpm --filter @third-code-erp/api exec vitest run integration
          --reporter=json
          --outputFile="$GITHUB_WORKSPACE/tmp/database-reproducibility/api-integration-vitest.json"
      - name: Assert every Nest integration test executed
        run: >-
          node scripts/assert-vitest-no-skips.mjs
          tmp/database-reproducibility/api-integration-vitest.json
          "API integration tests"
      - name: Run Web database integrations without skips
        run: >-
          pnpm --filter @third-code-erp/web exec vitest run
          src/lib/management-dashboard.integration.test.ts
          'src/app/(dashboard)/crm/opportunities/[id]/proposal/change-request-workflow.integration.test.ts'
          src/app/owner/owner-console-actions.integration.test.ts
          --reporter=json
          --outputFile="$GITHUB_WORKSPACE/tmp/database-reproducibility/web-database-integration-vitest.json"
      - name: Assert every Web database integration test executed
        run: >-
          node scripts/assert-vitest-no-skips.mjs
          tmp/database-reproducibility/web-database-integration-vitest.json
          "Web database integration tests"
      - name: Build and smoke the Nest production container
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file apps/api/Dockerfile \
            --tag third-code-erp-api:ci \
            .
          docker run --detach \
            --name third-code-erp-api-ci \
            --network host \
            --env NODE_ENV=test \
            --env PORT=3091 \
            --env DATABASE_URL \
            --env REDIS_URL \
            --env SUPABASE_URL=http://127.0.0.1:54321 \
            --env SUPABASE_ANON_KEY=local-ci-anon-key-not-a-secret \
            --env ERP_API_CORS_ORIGINS=http://127.0.0.1:3000 \
            third-code-erp-api:ci
          cleanup() {
            docker logs third-code-erp-api-ci || true
            docker rm --force third-code-erp-api-ci || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3091/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Nest API health check timed out" >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3091/ready >/dev/null
          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --request PATCH \
              --header 'Content-Type: application/json' \
              --data '{}' \
              http://127.0.0.1:3091/v1/projects/33333333-3333-4333-8333-333333333333
          )"
          test "$status" = "401"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: database-reproducibility
          path: |
            tmp/database-reproducibility/
            packages/database/tmp/release-coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, build-ops-invariants, database-reproducibility]
    env:
      # Build-time envs. If a repo secret is set, it wins; otherwise placeholders
      # keep CI green. The artifact is just a buildability gate — Vercel runs its
      # own build with real envs at deploy time.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:placeholder@db.placeholder.supabase.co:5432/postgres' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Vercel spend guard
        run: node scripts/verify-vercel-spend-guard.mjs
      - run: pnpm turbo build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-build
          path: apps/web/.next/
          retention-days: 1

  e2e:
    name: E2E Tests (trusted PR)
    runs-on: ubuntu-latest
    needs: [build]
    # Forked PRs cannot safely receive test credentials. Trusted PRs must
    # supply an isolated E2E target; absence is a failure, never a green skip.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.E2E_BASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ROLE_MATRIX_AUTH: "1"
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.E2E_VERCEL_PROTECTION_BYPASS_SECRET }}
      E2E_PROJECT_ID: ${{ vars.E2E_PROJECT_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Require isolated E2E configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in PLAYWRIGHT_BASE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY E2E_USER_EMAIL E2E_USER_PASSWORD E2E_VERCEL_PROTECTION_BYPASS_SECRET E2E_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required for trusted-PR authenticated E2E" >&2
              exit 1
            fi
          done
      - name: Run authenticated E2E smoke and 13-role access matrix
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          report_path="$GITHUB_WORKSPACE/tmp/e2e/playwright.json"
          mkdir -p "$(dirname "$report_path")"
          pnpm exec playwright test e2e/smoke-console.spec.ts e2e/role-access-production.spec.ts \
            --project=chromium --workers=1 --reporter=json > "$report_path"
          node "$GITHUB_WORKSPACE/scripts/assert-playwright-no-skips.mjs" \
            "$report_path" "trusted-PR authenticated E2E"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: tmp/e2e/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [actionlint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install production dependency graph without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level low
      - name: Audit the complete resolved dependency graph
        run: pnpm audit --audit-level low
      - name: Scan for secrets (gitleaks)
        run: node scripts/run-gitleaks.mjs
