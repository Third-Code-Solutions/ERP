name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# All third-party actions are pinned to a commit SHA (with the human-readable
# version trailing as a comment) per OWASP/SLSA hardening guidance and to make
# offline editor lint extensions resolve cleanly.
jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run actionlint
        run: node scripts/run-actionlint.mjs

  build-ops-invariants:
    name: BUILD OPS Invariants
    runs-on: ubuntu-latest
    needs: [actionlint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify ABI OPS brand contract
        run: pnpm verify:abi-ops-brand
      - name: Verify production type-safety contract
        run: pnpm verify:type-safety
      - name: Verify App Router boundaries
        run: pnpm verify:app-router-boundaries
      - name: Test invariant scanner
        run: pnpm test:build-ops-invariants
      - name: Collect changed migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/build-ops
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR \
              "origin/${GITHUB_BASE_REF}...${GITHUB_SHA}" -- \
              'supabase/migrations/*.sql' > tmp/build-ops/changed-migrations.txt
          elif [ "${GITHUB_EVENT_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            git ls-files 'supabase/migrations/*.sql' > tmp/build-ops/changed-migrations.txt
          else
            git diff --name-only --diff-filter=ACMR \
              "${GITHUB_EVENT_BEFORE}" "${GITHUB_SHA}" -- \
              'supabase/migrations/*.sql' > tmp/build-ops/changed-migrations.txt
          fi
          cat tmp/build-ops/changed-migrations.txt
      - name: Verify changed migration invariants
        run: node scripts/verify-build-ops-invariants.mjs --files-list tmp/build-ops/changed-migrations.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: build-ops-invariants
          path: tmp/build-ops/
          retention-days: 7

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [actionlint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [actionlint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [actionlint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo test
      - run: pnpm test:database-release-plan
      - run: pnpm test:project-cutover-plan
      - run: pnpm test:demo-tenant
      - run: pnpm test:process-sla-sql
      - run: pnpm test:wo-04-migration
      - run: pnpm test:wo-05-migration
      - run: pnpm test:wo-06-migration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: packages/*/coverage/

  database-reproducibility:
    name: Database Reproducibility (Postgres 17)
    runs-on: ubuntu-latest
    needs: [actionlint, build-ops-invariants]
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4.9-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Supabase local database only. No project reference, access token, or
      # production secret is present in this job.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_HARDENING_EXPECTED: "1"
      DATABASE_ACCOUNTING_EXPECTED: "1"
      DATABASE_RECEIVABLES_EXPECTED: "1"
      DATABASE_PAYABLES_EXPECTED: "1"
      DATABASE_CASH_EXPECTED: "1"
      DATABASE_RECONCILIATION_EXPECTED: "1"
      DATABASE_INVENTORY_EXPECTED: "1"
      DATABASE_BUDGET_EXPECTED: "1"
      DATABASE_STOCK_MOVEMENT_EXPECTED: "1"
      BUILD_OPS_DEMO_TENANT_SLUGS: abi-ops-local
      ERP_API_INTEGRATION_EXPECTED: "1"
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned database runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.109.1"
          grep -Eq '^major_version = 17$' supabase/config.toml
          docker version
          mkdir -p tmp/database-reproducibility
      - name: Rebuild database from zero
        run: |
          supabase db start
          supabase db reset --local
      - name: Verify BUILD OPS data invariant
        run: pnpm verify:build-ops-data
      - name: Verify migration ledger and catalog
        run: node scripts/verify-database-repro.mjs
      - name: Verify release planner sees a current linear ledger
        run: node scripts/plan-database-release.mjs --require-current
      - name: Verify WO-04 database contract
        run: pnpm verify:wo-04-database
      - name: Verify WO-05 location dimension
        run: pnpm verify:wo-05-database
      - name: Verify WO-06 DUPA engine
        run: pnpm verify:wo-06-database
      - name: Verify WO-06 DUPA behavior
        run: pnpm verify:wo-06-database-behavior
      - name: Capture local migration ledger
        shell: bash
        run: |
          set -o pipefail
          supabase migration list --local 2>&1 \
            | tee tmp/database-reproducibility/migration-list.txt
      - name: Run database tests without skips
        run: >-
          pnpm --filter @third-code-erp/database exec vitest run
          --reporter=json
          --outputFile="$GITHUB_WORKSPACE/tmp/database-reproducibility/vitest.json"
      - name: Assert every database test executed
        run: >-
          node scripts/assert-vitest-no-skips.mjs
          tmp/database-reproducibility/vitest.json
      - name: Run Nest transaction boundary integration
        run: pnpm --filter @third-code-erp/api test:integration
      - name: Build and smoke the Nest production container
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file apps/api/Dockerfile \
            --tag third-code-erp-api:ci \
            .
          docker run --detach \
            --name third-code-erp-api-ci \
            --network host \
            --env NODE_ENV=test \
            --env PORT=3091 \
            --env DATABASE_URL \
            --env REDIS_URL \
            --env SUPABASE_URL=http://127.0.0.1:54321 \
            --env SUPABASE_ANON_KEY=local-ci-anon-key-not-a-secret \
            --env ERP_API_CORS_ORIGINS=http://127.0.0.1:3000 \
            third-code-erp-api:ci
          cleanup() {
            docker logs third-code-erp-api-ci || true
            docker rm --force third-code-erp-api-ci || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3091/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Nest API health check timed out" >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3091/ready >/dev/null
          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --request PATCH \
              --header 'Content-Type: application/json' \
              --data '{}' \
              http://127.0.0.1:3091/v1/projects/33333333-3333-4333-8333-333333333333
          )"
          test "$status" = "401"
      - name: Capture and assert empty schema diff
        run: >-
          supabase db diff --local --schema public
          --output tmp/database-reproducibility/schema-diff.sql
      - run: >-
          node scripts/assert-empty-schema-diff.mjs
          tmp/database-reproducibility/schema-diff.sql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: database-reproducibility
          path: tmp/database-reproducibility/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, build-ops-invariants, database-reproducibility]
    env:
      # Build-time envs. If a repo secret is set, it wins; otherwise placeholders
      # keep CI green. The artifact is just a buildability gate — Vercel runs its
      # own build with real envs at deploy time.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:placeholder@db.placeholder.supabase.co:5432/postgres' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-build
          path: apps/web/.next/
          retention-days: 1

  e2e-local:
    name: Local Browser E2E
    runs-on: ubuntu-latest
    needs: [build]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      DATABASE_URL: postgresql://postgres:placeholder@db.placeholder.supabase.co:5432/postgres
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: next-build
          path: apps/web/.next
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Start production server
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../tmp/e2e-local
          pnpm exec next start -p 3000 \
            > ../../tmp/e2e-local/server.log 2>&1 &
          echo "$!" > ../../tmp/e2e-local/server.pid
          for attempt in {1..30}; do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../../tmp/e2e-local/server.log
          exit 1
      - name: Run public browser E2E
        working-directory: apps/web
        run: pnpm exec playwright test e2e/frontend-release-local.spec.ts --project=chromium --workers=1
      - name: Run unauthenticated auth-boundary E2E
        working-directory: apps/web
        run: pnpm exec playwright test e2e/auth.spec.ts --project=chromium --workers=1 --grep-invert "invalid credentials"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: local-e2e-report
          path: |
            apps/web/playwright-report/
            tmp/e2e-local/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    # Hosted E2E is a release gate. Run the job on every pull request so a
    # missing URL, Supabase config, or dedicated test identity fails closed
    # instead of silently appearing as a green skipped check.
    if: github.event_name == 'pull_request'
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify hosted E2E configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PLAYWRIGHT_BASE_URL:-}" || { echo 'E2E_BASE_URL is required'; exit 1; }
          test -n "${E2E_USER_EMAIL:-}" || { echo 'E2E_USER_EMAIL is required'; exit 1; }
          test -n "${E2E_USER_PASSWORD:-}" || { echo 'E2E_USER_PASSWORD is required'; exit 1; }
          test -n "${NEXT_PUBLIC_SUPABASE_URL:-}" || { echo 'NEXT_PUBLIC_SUPABASE_URL is required for authenticated smoke'; exit 1; }
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" || { echo 'NEXT_PUBLIC_SUPABASE_ANON_KEY is required for authenticated smoke'; exit 1; }
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: apps/web
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: [actionlint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
