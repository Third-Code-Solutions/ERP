[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "packages/ai/**",
  "packages/config/**",
  "packages/database/**",
  "packages/operations/**",
  "packages/shared-types/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "turbo.json",
  "railway.toml",
  ".dockerignore",
  ".npmrc",
  "apps/api/Dockerfile",
]

[deploy]
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/ready"
# /ready bounds its dependency probes and answers within ~2s either way, so a
# long timeout only delays Railway's verdict. Keep it short so an unhealthy
# instance is recycled instead of sitting unrouted.
healthcheckTimeout = 15
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
