[extend]
useDefault = true

[[allowlists]]
description = "Deterministic pg_dump schema delimiter; not a credential"
paths = ['''^scripts/ci/run-wsl1-database-lane\.ps1$''']
regexTarget = "match"
regexes = ['''--restrict-key=0123456789abcdef0123456789abcdef''']

[[allowlists]]
description = "Deterministic delivery idempotency keys in unit tests; not credentials"
paths = [
  '''^apps/api/src/procurement/delivery-workflow\.controller\.spec\.ts$''',
  '''^apps/web/src/app/\(dashboard\)/procurement/deliveries/actions\.test\.ts$''',
  '''^apps/web/src/lib/erp-core-client\.test\.ts$''',
]
regexTarget = "match"
regexes = [
  '''delivery-schedule-1''',
  '''delivery-schedule-2''',
  '''delivery-in-transit-1''',
]

[[allowlists]]
description = "Historical architecture prose; not a credential"
paths = ['''^docs/architecture/CURRENT_STATE\.md$''']
regexTarget = "line"
regexes = ['''idempotent replay/key conflict, journal/ledger/PO quantity side effects''']

[[allowlists]]
description = "Pinned Railway and Supabase resource identifiers; not credentials"
paths = ['''^\.github/workflows/deploy-production\.yml$''']
regexTarget = "line"
regexes = [
  '''RAILWAY_PROJECT_ID: a21fd382-80b2-4218-8025-11f420a062e3''',
  '''RAILWAY_API_SERVICE_ID: c45b3d01-036a-4663-a524-0713d782fce3''',
  '''RAILWAY_CAD_SERVICE_ID: 328c6650-306e-4a3c-80dc-7566e80ba86a''',
]

[[allowlists]]
description = "Deterministic change-request retry fixture; not a credential"
paths = ['''^apps/web/src/app/\(dashboard\)/crm/opportunities/\[id\]/proposal/actions\.test\.ts$''']
regexTarget = "match"
regexes = ['''change-request-form-1''']
