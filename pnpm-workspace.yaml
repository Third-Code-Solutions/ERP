packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  # Security remediation baseline. Exact versions address the recorded audit
  # findings without adding a package or expanding the public API surface.
  "@xmldom/xmldom": 0.8.15
  form-data: 4.0.6
  "minimatch@3>brace-expansion": 1.1.21
  "minimatch@5>brace-expansion": 2.1.7
  "minimatch@10>brace-expansion": 5.0.12
  nanoid: 3.3.18
  postcss: 8.5.23
  qs: 6.16.1
  sharp: 0.35.5
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  multer: 2.5.0
  body-parser: 2.4.0
  systeminformation: 5.33.16
  # Build-time only. @nestjs/cli pins glob 13.0.6; GHSA-3g3m-2fjr-6pw4 covers
  # glob >=9 <=14.0.1 and the first patch is 14.0.2 (same API for the CLI).
  "@nestjs/cli>glob": 14.0.2
  "@ai-sdk/provider-utils@4": 4.0.33
  shell-quote: 1.11.0
  # ABI OPS calls Mammoth's library, never its optional command-line program.
  # Remove the CLI-only argparse -> unpatched sprintf-js advisory chain.
  "mammoth@1.12.0>argparse": "-"
  tmp: 0.2.7
  fast-uri: 3.1.9
  js-yaml: 4.3.2
  "vite>esbuild": 0.28.2
  "drizzle-kit>esbuild": 0.28.2
  "@esbuild-kit/core-utils>esbuild": 0.28.2
  drizzle-orm: 0.45.2
  # Inngest accepts the 0.x OpenTelemetry range; keep the selected telemetry
  # implementation on the patched line without widening any application API.
  "inngest>@opentelemetry/auto-instrumentations-node": 0.79.0
  "inngest>@opentelemetry/exporter-trace-otlp-http": 0.221.0
  "@opentelemetry/otlp-grpc-exporter-base>@grpc/grpc-js": 1.14.5
  "@grpc/proto-loader>protobufjs": 7.6.5
  "exceljs>uuid": 11.1.1
  "inngest>@opentelemetry/context-async-hooks": 2.10.0
  "inngest>@opentelemetry/instrumentation": 0.221.0
  "inngest>@opentelemetry/resources": 2.10.0
  "inngest>@opentelemetry/sdk-trace-base": 2.10.0
  "@traceloop/instrumentation-anthropic>@opentelemetry/core": 2.10.0

# Scoped advisory waiver. `braces` GHSA-vfj7-8cjw-p6xm is flagged `<=3.0.3`
# with no patched release published (3.0.3 is the newest version and has been
# unchanged since 2024-09-18), so no override can resolve it. It is reachable
# only from the root devDependency chain
#   eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch > braces
# and is absent from the production dependency graph, which `pnpm audit --prod`
# verifies clean. This waiver names one advisory; the audit level is unchanged
# and every other advisory still fails the gate.
#
# The following three waivers are time-boxed to 2026-12-04
# (docs/changesets/2026-11-04-dependency-audit-remediation.md).
#
# - zod GHSA-mrhx-c7xc-m3w5 (direct prod dependency: api, operations,
#   shared-types; also openai > zod): only zod >=4.6.6 is patched, a major
#   upgrade across ~230 files. zod 3 is affected too: ZodArray records one
#   issue per failing element and `.max()` does not stop early, so an
#   oversized invalid array costs ~200 MB of heap per MB of body. Compensating
#   controls until the migration:
#     * Core API: `rejectOversizedJsonArrays` (apps/api/src/main.ts) rejects
#       bodies with more than 20,000 array elements before guards and pipes.
#     * Core API: every non-public route sits behind the global Supabase JWT
#       guard, which runs before pipes; the DocuSeal webhook checks its token
#       before validating; public signing and vendor confirmation bodies have
#       no array or record fields.
#     * Web: Server Action bodies are capped at 3 MB (next.config.ts).
#   Residual risk: an authenticated user can still make one Server Action
#   invocation allocate several hundred MB (3 MB body). Remove the waiver with
#   the zod 4 migration.
# - minimatch GHSA-g3hv-75wg-m249 (exceljs > archiver > glob@7 > minimatch@3,
#   archiver-utils > glob@8 > minimatch@5): only 11.0.1 is patched. Patterns
#   are library-fixed; an attack needs attacker-controlled glob patterns,
#   which no ABI OPS input provides. The 11.x API is incompatible with those
#   consumers.
# - deepmerge GHSA-gcqx-w48m-w2h4 (@nestjs/cli > fork-ts-checker-webpack-plugin
#   > deepmerge): no patched release exists. Build-time only; it merges local
#   build config and is absent from the production graph.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-g3hv-75wg-m249
    - GHSA-gcqx-w48m-w2h4

peerDependencyRules:
  ignoreMissing:
    - '@opentelemetry/api'
    - '@types/pg'
